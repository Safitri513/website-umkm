<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donat Manis</title> - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">UMKM Pekalongan</p>
        <h1>Donat Manis</h1>
        <p>Donat lezat dengan berbagai rasa untuk menemani hari kamu.</p>
        <button id="promoButton" type="button">Lihat promo donat hari ini</button>
      </section>

      <section aria-labelledby="produk-title">
        <h2 id="produk-title">Menu Donat</h2>
        <ul class="products">
          <li>Donat Cokelat - Rp10.000</li>
          <li>Donat Keju - Rp12.000</li>
          <li>Donat Stroberi - 12.000</li>
        </ul>
      </section>
      <section aria-labelledby="info-title">
        <h2 id="info-title">Jam Buka & Lokasi</h2> 
        <p>Jam Buka : 08.00 - 20.00</p>
        <p>Lokasi : Jl. Raya Pekalongan , Wonopringgo</p>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
